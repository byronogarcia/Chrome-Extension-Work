<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 260px;
      padding: 12px;
      margin: 0;
      font-size: 13px;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #333;
    }
    .site-label {
      font-size: 11px;
      color: #888;
      margin-bottom: 8px;
    }
    select {
      width: 100%;
      padding: 5px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      margin-bottom: 8px;
    }
    button {
      width: 100%;
      padding: 7px;
      margin-top: 2px;
      background-color: #2e7d32;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #aaa;
      cursor: default;
    }
    #status {
      color: #555;
      font-size: 12px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h3>Giva CC Autofill</h3>
  <div class="site-label" id="site-label"></div>

  <!-- Corporate UI — hidden until corp site detected -->
  <div id="corp-ui" style="display:none;">
    <div id="dropdowns"></div>
    <button id="confirm-btn" disabled>Apply</button>
  </div>

  <!-- Regular site UI -->
  <div id="regular-ui">
    <div id="status">Detecting site...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
